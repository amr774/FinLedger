global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: finledger-api
    metrics_path: /api/v1/monitoring/metrics
    authorization:
      { type: Bearer, credentials_file: /run/secrets/monitoring-token }
    static_configs: [{ targets: ['api:3000'] }]
  - job_name: finledger-worker
    metrics_path: /metrics
    authorization:
      { type: Bearer, credentials_file: /run/secrets/monitoring-token }
    static_configs: [{ targets: ['worker:3001'] }]
