name: finledger-production
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  stop_grace_period: 30s
  logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
services:
  migrate:
    profiles: [operations]
    build:
      {
        context: .,
        dockerfile: docker/production-api.Dockerfile,
        target: migration,
      }
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set separate TLS migration credentials}
    volumes: ['./secrets/database-ca.pem:/run/secrets/database-ca.pem:ro']
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  api:
    <<: *hardening
    build:
      {
        context: .,
        dockerfile: docker/production-api.Dockerfile,
        target: runtime,
      }
    environment: &runtime-env
      NODE_ENV: production
      DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set least-privilege runtime URL without SSL query parameters}
      DATABASE_CA_FILE: /run/secrets/database-ca.pem
      NODE_EXTRA_CA_CERTS: /run/secrets/services-ca.pem
      JWT_SECRET: ${JWT_SECRET:?Set random JWT secret}
      MONITORING_TOKEN: ${MONITORING_TOKEN:?Set separate monitoring token}
      WEB_ORIGIN: https://${PUBLIC_DOMAIN:?Set public domain}
      REDIS_URL: ${REDIS_URL:?Set rediss URL}
      RABBITMQ_URL: ${RABBITMQ_URL:?Set amqps URL}
      TRUST_PROXY_CIDRS: 172.30.80.2/32
      LOG_LEVEL: info
    volumes: &runtime-volumes
      - './secrets/database-ca.pem:/run/secrets/database-ca.pem:ro'
      - './secrets/services-ca.pem:/run/secrets/services-ca.pem:ro'
    tmpfs: [/tmp]
    mem_limit: 768m
    cpus: 1.0
    networks: [backend]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 30s
  worker:
    <<: *hardening
    build:
      {
        context: .,
        dockerfile: docker/production-api.Dockerfile,
        target: runtime,
      }
    command: [node, apps/api/dist/src/worker.js]
    environment: *runtime-env
    volumes: *runtime-volumes
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.5
    networks: [backend]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 30s
  web:
    <<: *hardening
    build: { context: ., dockerfile: docker/production-web.Dockerfile }
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 3s
      retries: 3
  edge:
    <<: *hardening
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    cap_add: [NET_BIND_SERVICE]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports: ['80:80', '443:443']
    volumes:
      - './docker/Caddyfile:/etc/caddy/Caddyfile:ro'
      - 'caddy-data:/data'
      - 'caddy-config:/config'
    networks: { backend: { ipv4_address: 172.30.80.2 } }
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      {
        api: { condition: service_healthy },
        web: { condition: service_healthy },
      }
  prometheus:
    <<: *hardening
    profiles: [monitoring]
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=15d,
      ]
    volumes:
      - './ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './ops/alerts.yml:/etc/prometheus/alerts.yml:ro'
      - './secrets/monitoring-token:/run/secrets/monitoring-token:ro'
      - 'metrics-data:/prometheus'
    ports: ['127.0.0.1:9090:9090']
    mem_limit: 512m
    cpus: 0.5
    networks: [backend]
networks:
  backend:
    ipam: { config: [{ subnet: 172.30.80.0/24 }] }
volumes:
  caddy-data:
  caddy-config:
  metrics-data:
